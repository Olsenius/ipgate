name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t ipgate:ci .
      - name: smoke test healthcheck
        run: |
          docker run -d --name ipgate \
            -e PUBLIC_URL=https://enable.example -e OIDC_ISSUER=http://127.0.0.1:1 \
            -e OIDC_CLIENT_ID=ci -e OIDC_CLIENT_SECRET=ci \
            -e SESSION_SECRET=0123456789abcdef0123456789abcdef \
            ipgate:ci
          for i in $(seq 1 20); do
            docker exec ipgate /usr/local/bin/ipgate healthcheck && exit 0
            sleep 1
          done
          docker logs ipgate
          exit 1
