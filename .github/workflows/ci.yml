name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker build
        run: docker build -t ipgate:ci .
      - name: smoke test healthcheck
        run: |
          docker run -d --name ipgate \
            -e PUBLIC_URL=https://enable.example -e OIDC_ISSUER=http://127.0.0.1:1 \
            -e OIDC_CLIENT_ID=ci -e OIDC_CLIENT_SECRET=ci \
            -e SESSION_SECRET=0123456789abcdef0123456789abcdef \
            ipgate:ci
          for i in $(seq 1 20); do
            docker exec ipgate /usr/local/bin/ipgate healthcheck && exit 0
            sleep 1
          done
          docker logs ipgate
          exit 1

  # Publishes the image to GHCR (private, like the repository). Runs only for
  # pushes to main and v* tags, after tests and the image smoke test pass;
  # pull requests never publish.
  publish:
    needs: [test, docker]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/olsenius/ipgate
          flavor: |
            latest=false
          # main: sha-<7 chars> and main. Git tag v1.2.3: v1.2.3, 1.2 and 1.
          tags: |
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=semver,pattern={{raw}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          # The default labels include org.opencontainers.image.source,
          # .revision and .created.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
